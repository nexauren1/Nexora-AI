name: Nexora AI Android Release

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native Android release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          file android/app/build/outputs/apk/release/app-release.apk
          unzip -t android/app/build/outputs/apk/release/app-release.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-native-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="android-v0.3.\${GITHUB_RUN_NUMBER}"
          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            "Nexora-AI-\${VERSION}.apk"

          gh release create "\${VERSION}" \
            "Nexora-AI-\${VERSION}.apk" \
            --title "Nexora AI \${VERSION} — Native Android" \
            --notes "Real native Android application. No WebView. Built from commit \${GITHUB_SHA}."
