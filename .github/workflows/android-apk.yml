name: Nexora AI Android Release

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native Android release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          file android/app/build/outputs/apk/release/app-release.apk
          unzip -t android/app/build/outputs/apk/release/app-release.apk >/dev/null

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-native-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="android-v0.4.${GITHUB_RUN_NUMBER}"
          cp             android/app/build/outputs/apk/release/app-release.apk             "Nexora-AI-${VERSION}.apk"

          gh release create "${VERSION}"             "Nexora-AI-${VERSION}.apk"             --title "Nexora AI ${VERSION} — Native Android"             --notes "Real native Android application. No WebView. Native UI with Home, History, Settings and tool modes. Built from commit ${GITHUB_SHA}."

      - name: Record successful release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="android-v0.4.${GITHUB_RUN_NUMBER}"
          STATUS_PATH="android-release-status.json"
          CONTENT=$(printf '{"status":"success","version":"%s","run_id":"%s","commit":"%s","apk":"Nexora-AI-%s.apk"}'             "${VERSION}" "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${VERSION}" | base64 -w 0)

          SHA=$(gh api             "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}"             --jq .sha 2>/dev/null || true)

          if [ -n "${SHA}" ]; then
            gh api               "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}"               -X PUT               -f message="ci: record successful Android release"               -f content="${CONTENT}"               -f sha="${SHA}"
          else
            gh api               "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}"               -X PUT               -f message="ci: record successful Android release"               -f content="${CONTENT}"
          fi

      - name: Record failed build
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS_PATH="android-release-status.json"
          CONTENT=$(printf '{"status":"failed","run_id":"%s","commit":"%s"}'             "${GITHUB_RUN_ID}" "${GITHUB_SHA}" | base64 -w 0)

          SHA=$(gh api             "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}"             --jq .sha 2>/dev/null || true)

          if [ -n "${SHA}" ]; then
            gh api               "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}"               -X PUT               -f message="ci: record failed Android build"               -f content="${CONTENT}"               -f sha="${SHA}"
          else
            gh api               "repos/${GITHUB_REPOSITORY}/contents/${STATUS_PATH}"               -X PUT               -f message="ci: record failed Android build"               -f content="${CONTENT}"
          fi
