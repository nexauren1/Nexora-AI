
name: Android APK

on:
  push:
    branches: ["main"]
    paths:
      - "android/**"
      - "frontend/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copy web app into Android assets
        run: |
          rm -rf android/app/src/main/assets/frontend
          mkdir -p android/app/src/main/assets
          cp -R frontend android/app/src/main/assets/frontend

      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ai-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create APK release
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="android-v0.2.\${GITHUB_RUN_NUMBER}"
          gh release create "\${VERSION}" \
            "android/app/build/outputs/apk/debug/app-debug.apk" \
            --title "Nexora AI \${VERSION} — Android APK" \
            --notes "Debug APK built from commit \${GITHUB_SHA}."
