name: Sandbox Release

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "${VERSION}"             --title "Nexora AI ${VERSION} — Sandbox"             --notes "Sandbox build generated from commit ${GITHUB_SHA}."
